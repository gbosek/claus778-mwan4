name: OpenWrt QEMU integration

# VM tests run ONCE per pull request instead of twice on feature pushes
# plus pull_request events. Manual dispatch remains available.
on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'openwrt/**'
      - 'tests/openwrt_vm.py'
      - '.github/workflows/openwrt-vm.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openwrt-qemu:
    name: OpenWrt 24.10.5 / real PPPoE, DHCP, firewall4, PBR
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and virtual WAN test services
        timeout-minutes: 9
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          mkdir -p /tmp/mwan4-vm-logs
          # Bound APT and retain its logs: network mirrors can otherwise hang
          # indefinitely before the guest is even booted.
          for attempt in 1 2; do
            echo "APT package index attempt $attempt"
            if timeout --signal=TERM --kill-after=10s 180s \
                sudo -E apt-get update -o Acquire::Retries=2 \
                >/tmp/mwan4-vm-logs/apt-update.log 2>&1; then
              break
            fi
            tail -n 50 /tmp/mwan4-vm-logs/apt-update.log
            if [ "$attempt" -eq 2 ]; then exit 1; fi
          done
          timeout --signal=TERM --kill-after=10s 240s \
            sudo -E apt-get install -y \
            -o Dpkg::Options::=--force-confold \
            -o Acquire::Retries=2 \
            qemu-system-x86 qemu-utils iproute2 dnsmasq-base pppoe ppp python3-pexpect \
            >/tmp/mwan4-vm-logs/apt-install.log 2>&1 || {
              tail -n 120 /tmp/mwan4-vm-logs/apt-install.log
              exit 1
            }
          command -v qemu-system-x86_64
          command -v pppoe-server
          python3 -c 'import pexpect; print("pexpect ready")'
      - name: Compile Python VM harness before download
        run: python3 -m py_compile tests/openwrt_vm.py
      - name: Download and verify official OpenWrt x86_64 ext4 disk
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 \
            -o /tmp/openwrt.img.gz \
            https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-24.10.5-x86-64-generic-ext4-combined.img.gz
          printf '%s  %s\n' \
            5b854a7a2909a0b21887ba9be773b0964eb28fef81d6b8399d32a0f270a5d8ff \
            /tmp/openwrt.img.gz | sha256sum --check
          # The official combined image may have trailing non-gzip padding:
          # GNU gzip exits 2 with a warning despite a verified SHA256 file.
          # Require a complete zlib gzip member (eof), then ignore only tail.
          python3 - <<'PY'
          from pathlib import Path
          import zlib
          packed = Path('/tmp/openwrt.img.gz').read_bytes()
          stream = zlib.decompressobj(wbits=31)
          payload = stream.decompress(packed) + stream.flush()
          assert stream.eof, 'incomplete gzip member'
          assert len(payload) > 16 * 1024 * 1024, 'truncated OpenWrt image'
          Path('/tmp/openwrt.img').write_bytes(payload)
          print(f'OpenWrt image: {len(payload)} bytes; {len(stream.unused_data)} trailing padding bytes')
          PY
          # Boot the matching official kernel directly so /dev/console uses
          # ttyS0, not VGA (which is noninteractive on headless Actions).
          curl --fail --location --retry 4 --retry-delay 3 \
            -o /tmp/openwrt-kernel.bin \
            https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-24.10.5-x86-64-generic-kernel.bin
          printf '%s  %s\n' \
            2453476e27bcc5716e84ece27630c3e494e3d45a4d3240d55b7c3d630d3289c8 \
            /tmp/openwrt-kernel.bin | sha256sum --check
      - name: Build actual Rust static binary
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Compile release Rust executable
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Stage OpenWrt test payload without enabling package
        run: |
          mkdir -p /tmp/mwan4-vm-payload
          install -m755 target/x86_64-unknown-linux-musl/release/mwan4 /tmp/mwan4-vm-payload/mwan4
          cp openwrt/luci-app-mwan4/root/etc/init.d/mwan4 /tmp/mwan4-vm-payload/mwan4-init
          cp openwrt/luci-app-mwan4/root/etc/config/mwan4 /tmp/mwan4-vm-payload/mwan4-uci
          cp openwrt/mwan4-pbr-compat/files/usr/libexec/mwan4-pbr-compat /tmp/mwan4-vm-payload/pbr-compat
      - name: Boot OpenWrt and execute integration regression
        timeout-minutes: 22
        run: |
          python3 tests/openwrt_vm.py \
            --image /tmp/openwrt.img \
            --kernel /tmp/openwrt-kernel.bin \
            --payload /tmp/mwan4-vm-payload \
            --output /tmp/mwan4-vm-logs
      - name: Upload guest serial and WAN service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vm-logs
          path: /tmp/mwan4-vm-logs
          if-no-files-found: ignore
