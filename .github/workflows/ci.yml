name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master, 'feature/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generic-openwrt:
    name: generic defaults / netifd / LuCI syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POSIX shell syntax
        run: sh -n openwrt/luci-app-mwan4/root/etc/init.d/mwan4 tests/generic-openwrt-init.sh
      - name: LuCI JavaScript syntax
        run: node --check openwrt/luci-app-mwan4/htdocs/luci-static/resources/view/mwan4/overview.js
      - name: No-WAN and dynamic PPPoE regression tests
        run: sh tests/generic-openwrt-init.sh
      - name: PBR compatibility helper syntax
        run: sh -n openwrt/mwan4-pbr-compat/files/usr/libexec/mwan4-pbr-compat
      - name: Ensure no installer auto-starts mwan4
        run: |
          python - <<'PY'
          import pathlib
          script = pathlib.Path("scripts/build_packages.py").read_text()
          assert '"/etc/init.d/mwan4 enable' not in script
          assert '"/etc/init.d/mwan4 restart' not in script
          assert 'build_mwan4_data_entries(bin_data, init_data, uci_config_data, json_config_data)' not in script
          PY
      - name: No preconfigured WAN in packaged UCI defaults
        run: |
          grep -q "^\s*option enabled '0'$" openwrt/luci-app-mwan4/root/etc/config/mwan4
          ! grep -q "^config interface" openwrt/luci-app-mwan4/root/etc/config/mwan4

  # ── 品质关卡：格式、静态检查、单元测试 ────────────────────────────────
  quality:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  # ── 交叉编译：静态 musl 二进位（x86_64 与 aarch64）───────────────────
  # 注意：musl target 仍会呼叫一个 `cc` 作为连结驱动（crt/libc 由 Rust 自带的
  # self-contained sysroot 提供）。因此
  #   - x86_64：runner 内建 gcc 即可，无需额外套件；
  #   - aarch64：必须另外装 gcc-aarch64-linux-gnu 并指定为 linker，
  #              否则 x86_64 的 gcc 无法输出 aarch64 执行档。
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            packages: ""
            linker: ""
          - target: aarch64-unknown-linux-musl
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: armv7-unknown-linux-musleabihf
            packages: gcc-arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Point cargo at the cross linker
        if: matrix.linker != ''
        run: |
          printf '[target.%s]\nlinker = "%s"\n' \
            "${{ matrix.target }}" "${{ matrix.linker }}" >> "$CARGO_HOME/config.toml"
          tail -n 5 "$CARGO_HOME/config.toml"

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Assert statically linked (no PT_INTERP)
        run: |
          BIN="target/${{ matrix.target }}/release/mwan4"
          file "$BIN"
          if readelf -lW "$BIN" | grep -q 'INTERP'; then
            echo "::error file=$BIN::binary is dynamically linked; musl target must be static"
            exit 1
          fi
          echo "OK: $BIN is a static binary"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mwan4-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/mwan4
          if-no-files-found: error

  # ── 打包链路：Python 语法、翻译编译、用假二进位做 APK/IPK/bundle 冒烟测试 ─
  # 这些脚本改坏时不会影响 Rust 编译，但会直接毁掉发布产物，所以独立把关。
  packaging:
    name: packaging scripts
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependency
        run: pip install cryptography

      - name: Python syntax check
        run: python -m py_compile scripts/build_packages.py scripts/po2lmo.py

      - name: Compile zh_Hans translation
        run: |
          python scripts/po2lmo.py \
            openwrt/luci-app-mwan4/po/zh_Hans/mwan4.po /tmp/mwan4.zh_Hans.lmo
          test -s /tmp/mwan4.zh_Hans.lmo

      - name: Packaging smoke test (dummy binary)
        run: |
          mkdir -p target/x86_64-unknown-linux-musl/release
          cp /bin/true target/x86_64-unknown-linux-musl/release/mwan4
          python scripts/build_packages.py --arch x86_64
          test -f dist/SHA256SUMS
          test -f dist/mwan4-x86_64-bundle.tar.gz
          ls -l dist/packages dist/SHA256SUMS
      - name: IPK control still validates (python)
        run: |
          python - <<'PY'
          import glob, io, tarfile
          ipk = sorted(glob.glob("dist/packages/mwan4_*_x86_64.ipk"))[-1]
          with tarfile.open(ipk, "r:gz") as t:
              name = [n for n in t.getnames() if n.startswith("control.tar")][0]
              ctrl = tarfile.open(fileobj=io.BytesIO(t.extractfile(name).read()), mode="r:gz")
              assert "conffiles" in ctrl.getnames(), "IPK must declare conffiles"
          print("OK", ipk)
          PY

  kernel-netns:
    name: privileged kernel ECMP / PBR / rollback regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: iproute2 network namespace regression
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 nftables iputils-ping cmake libjson-c-dev
          git init /tmp/mwan4-ucode
          git -C /tmp/mwan4-ucode fetch --depth 1 https://github.com/jow-/ucode.git 703b3b399ba18087e1407446f578fbb4f07cd616
          git -C /tmp/mwan4-ucode checkout --detach FETCH_HEAD
          cmake -S /tmp/mwan4-ucode -B /tmp/mwan4-ucode/build -DUCI_SUPPORT=OFF -DUBUS_SUPPORT=OFF -DULOOP_SUPPORT=OFF
          cmake --build /tmp/mwan4-ucode/build -j2
          UCODE=/tmp/mwan4-ucode/build/ucode
          LIB="$PWD/openwrt/mwan4-pbr-compat/files/lib/mwan4"
          for file in "$LIB"/*.uc; do "$UCODE" -S -c -o /tmp/mwan4-ucode-test.out "$file"; done
          "$UCODE" -S -L /tmp/mwan4-ucode/build -L "$LIB" tests/pbr-render.uc /tmp/mwan4-pbr-test.nft
          "$UCODE" -S -L "$LIB" tests/pbr-api.uc
          sudo sh tests/netns-kernel-ecmp-pbr.sh /tmp/mwan4-pbr-test.nft

  # ── 真实核心 netns 整合测试（advisory）────────────────────────────────
  # GitHub runner 对 unprivileged userns 有 AppArmor 限制时会直接跑不起来，
  # 因此不阻挡主线；本机能跑时才是有效的路由编码验证。
  netns:
    name: netns integration [advisory]
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: netns

      - name: Build tests
        run: cargo test --locked --no-run

      - name: Run Rust netns integration with isolated privileged network namespace
        run: |
          set -euo pipefail
          # Hosted runners restrict unprivileged userns (unshare -Urn).
          # Root-created ip-netns already works in the dedicated kernel job.
          sudo apt-get update
          sudo apt-get install -y iproute2
          NS="mwan4-rust-${{ github.run_id }}-$"
          cleanup() { sudo ip netns del "$NS" 2>/dev/null || :; }
          trap cleanup EXIT
          sudo ip netns add "$NS"
          sudo ip netns exec "$NS" ip link set lo up
          sudo ip netns exec "$NS" env \
            "HOME=$HOME" "PATH=$PATH" "CARGO_HOME=$CARGO_HOME" \
            RUST_BACKTRACE=1 MWAN4_NETNS_TEST=1 \
            cargo test --offline -- --ignored netns --test-threads=1

  # ── MSRV 守门：确保 Cargo.toml 宣告的 rust-version 真的能编过 ─────────
  # Cargo.toml 使用 edition 2024 并宣告 rust-version = "1.85"。
  # 此 job 为「预警」性质：若某个依赖悄悄把自身 MSRV 拉高，这里会变红提醒，
  # 但不阻挡主线（continue-on-error），避免第三方套件更新时无故卡住发布。
  msrv:
    name: msrv (1.85) [advisory]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo build (MSRV)
        run: cargo build --locked
